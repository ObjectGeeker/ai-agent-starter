spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ai_agent_starter?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 15 #最小空闲连接数量
      idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
      maximum-pool-size: 25 #连接池最大连接数，默认是10
      auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
      max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
      connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource
  application:
    name: ai-agent-starter
  config:
    import:
      - optional:file:.env[.properties]
      - agent/agent-dev.yml
server:
  servlet:
    context-path: /api
  port: 8123

# Redis 配置
app:
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6379
    username:
    password:
    database0: 0
    database1: 1
    max-retry: 3
    retry-interval: 1500ms
    timeout: 3s
    connect-timeout: 10s
    idle-connection-timeout: 10s
    connection-pool-size: 64
    connection-minimum-idle-size: 24
    subscription-connection-pool-size: 50
    subscription-connection-minimum-idle-size: 1
    ping-connection-interval: 30s
    keep-alive: true
    tcp-no-delay: true
    client-name: ai-agent-starter

############## Sa-Token 配置 (文档: https://sa-token.com) ##############
sa-token:
  # token 名称（同时也是 cookie 名称、Redis key 前缀）
  token-name: satoken
  # token 有效期（秒），默认 30 天，-1 永久
  timeout: 2592000
  # token 最低活跃频率（秒），-1 不限制
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 多人登录同一账号时是否共用一个 token
  is-share: false
  # token 风格（Simple 模式下最终为 JWT 风格）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # JWT 秘钥（从 .env 注入，请勿使用官网示例字符串）
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY}

